[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "adaptive-prompt-harness"
dynamic = ["version"]
description = "Learns how each LLM responds to different prompting strategies and adapts prompts automatically, with evidence."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "ayushiii2707" }]
keywords = ["llm", "prompt-optimization", "bandits", "evaluation", "agents"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.urls]
Repository = "https://github.com/ayushiii2707/agentic-harness"

[tool.hatch.version]
path = "src/adaptive_harness/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_harness"]

[tool.hatch.build.targets.sdist]
exclude = ["/.env", "/.harness", "/data/external"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # import from the source tree even if an editable install is not active
addopts = "-ra --strict-markers"
markers = [
  "live: makes real network calls to a model provider (never run by default)",
  "sandbox: runs code in the real Docker sandbox (skipped when Docker or the image is unavailable)",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length is enforced by `ruff format`; long docstrings and URLs are allowed

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/adaptive_harness"]

[[tool.mypy.overrides]]
module = ["tomli"]
ignore_missing_imports = true
